name: CI Pipeline

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restaurar dependencias
        run: dotnet restore MaquinaDeCafe/MaquinaDeCafe.sln

      - name: Compilar proyecto
        run: dotnet build MaquinaDeCafe/MaquinaDeCafe.sln --no-restore

      - name: Ejecutar pruebas
        run: dotnet test MaquinaDeCafe/MaquinaDeCafe.sln --no-build --verbosity normal